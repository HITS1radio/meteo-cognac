name: Météo Cognac

on:
  schedule:
    - cron: "55 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  meteo:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Générer RSS météo
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          from datetime import datetime
          from email.utils import format_datetime
          import xml.etree.ElementTree as ET

          # Météo de Cognac
          url = (
              "https://api.open-meteo.com/v1/forecast"
              "?latitude=45.695"
              "&longitude=-0.330"
              "&current=temperature_2m,apparent_temperature,"
              "weather_code,wind_speed_10m,wind_direction_10m"
              "&daily=temperature_2m_max,temperature_2m_min,"
              "wind_gusts_10m_max"
              "&timezone=Europe%2FParis"
              "&forecast_days=1"
          )

          data = json.load(
              urllib.request.urlopen(url)
          )

          current = data["current"]
          daily = data["daily"]

          temp = round(current["temperature_2m"])
          ressenti = round(current["apparent_temperature"])
          vent = round(current["wind_speed_10m"])
          direction = round(current["wind_direction_10m"])

          temp_max = round(
              daily["temperature_2m_max"][0]
          )

          temp_min = round(
              daily["temperature_2m_min"][0]
          )

          rafales = round(
              daily["wind_gusts_10m_max"][0]
          )

          # Traduction météo
          meteo = {
              0: "un ciel dégagé",
              1: "un temps ensoleillé",
              2: "un ciel partiellement nuageux",
              3: "un ciel couvert",
              45: "du brouillard",
              48: "du brouillard givrant",
              51: "de faibles bruines",
              53: "des bruines",
              55: "de fortes bruines",
              61: "de faibles pluies",
              63: "des pluies",
              65: "de fortes pluies",
              71: "de faibles chutes de neige",
              73: "des chutes de neige",
              75: "de fortes chutes de neige",
              80: "de faibles averses",
              81: "des averses",
              82: "de fortes averses",
              95: "un risque d'orage",
              96: "des orages avec grêle",
              99: "de forts orages avec grêle"
          }

          condition = meteo.get(
              current["weather_code"],
              "des conditions variables"
          )

          # Direction du vent
          directions = [
              "nord",
              "nord-est",
              "est",
              "sud-est",
              "sud",
              "sud-ouest",
              "ouest",
              "nord-ouest"
          ]

          direction_texte = directions[
              round(direction / 45) % 8
          ]

          # Heure de génération
          maintenant = datetime.now().astimezone()
          date_rss = format_datetime(maintenant)

          # Titre
          titre = (
              f"Météo Cognac : {temp} degrés actuellement, "
              f"jusqu'à {temp_max} degrés aujourd'hui"
          )

          # Bulletin radio
import random

debuts = [
    "Du côté de Cognac, ",
    "À Cognac, côté météo, ",
    "Petit point météo à Cognac : ",
    "Voici les dernières infos météo pour Cognac : ",
    "Pour la météo à Cognac, "
]

fins = [
    f"Le vent souffle actuellement à {vent} kilomètres heure "
    f"de secteur {direction_texte}, avec des rafales pouvant "
    f"atteindre {rafales} kilomètres heure.",

    f"Côté vent, il souffle à {vent} kilomètres heure "
    f"de secteur {direction_texte}, avec des rafales jusqu'à "
    f"{rafales} kilomètres heure.",

    f"Le vent est orienté {direction_texte} et souffle à "
    f"{vent} kilomètres heure, avec des rafales pouvant atteindre "
    f"{rafales} kilomètres heure."
]

debut = random.choice(debuts)
fin = random.choice(fins)

bulletin = (
    f"{debut}"
    f"il fait actuellement {temp} degrés, "
    f"avec {condition}. "
    f"La température ressentie est de {ressenti} degrés. "
    f"Cet après-midi, le thermomètre pourra atteindre "
    f"{temp_max} degrés. "
    f"La température minimale sera de {temp_min} degrés. "
    f"{fin}"
)
              f"Actuellement, il fait {temp} degrés, "
              f"avec {condition}. "
              f"La température ressentie est de {ressenti} degrés. "
              f"Cet après-midi, le thermomètre pourra atteindre "
              f"{temp_max} degrés. "
              f"La température minimale sera de {temp_min} degrés. "
              f"Le vent souffle actuellement à {vent} kilomètres heure "
              f"de secteur {direction_texte}, avec des rafales pouvant "
              f"atteindre {rafales} kilomètres heure."
          )

          # Création du RSS
          rss = ET.Element(
              "rss",
              version="2.0"
          )

          channel = ET.SubElement(
              rss,
              "channel"
          )

          ET.SubElement(
              channel,
              "title"
          ).text = "Bulletin météo Cognac"

          ET.SubElement(
              channel,
              "link"
          ).text = (
              "https://hits1radio.github.io/meteo-cognac/"
          )

          ET.SubElement(
              channel,
              "description"
          ).text = "Bulletin météo radio de Cognac"

          ET.SubElement(
              channel,
              "language"
          ).text = "fr-fr"

          item = ET.SubElement(
              channel,
              "item"
          )

          ET.SubElement(
              item,
              "title"
          ).text = titre

          ET.SubElement(
              item,
              "description"
          ).text = bulletin

          ET.SubElement(
              item,
              "pubDate"
          ).text = date_rss

          ET.SubElement(
              item,
              "guid"
          ).text = (
              f"meteo-cognac-{maintenant.timestamp()}"
          )

          ET.indent(
              rss,
              space="  "
          )

          ET.ElementTree(
              rss
          ).write(
              "rss.xml",
              encoding="utf-8",
              xml_declaration=True
          )

          print("Bulletin généré :")
          print(bulletin)

          PY

      - name: Publier le RSS
        run: |
          git config user.name "Météo Cognac"
          git config user.email "actions@github.com"

          git add rss.xml

          git commit -m "Mise à jour météo Cognac" || exit 0

          git push
