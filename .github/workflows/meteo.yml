name: Mise à jour météo Cognac

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rss:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Générer le flux RSS
        run: |
          python3 <<'PY'
          import json
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime

          url = (
              "https://api.open-meteo.com/v1/forecast"
              "?latitude=45.695"
              "&longitude=-0.330"
              "&current=temperature_2m,weather_code"
              "&daily=temperature_2m_max,temperature_2m_min,weather_code"
              "&timezone=Europe%2FParis"
              "&forecast_days=1"
          )

          data = json.load(urllib.request.urlopen(url))

          temp = round(data["current"]["temperature_2m"])
          current_code = data["current"]["weather_code"]
          temp_max = round(data["daily"]["temperature_2m_max"][0])
          temp_min = round(data["daily"]["temperature_2m_min"][0])
          day_code = data["daily"]["weather_code"][0]

          weather = {
              0: "ciel dégagé",
              1: "plutôt ensoleillé",
              2: "partiellement nuageux",
              3: "couvert",
              45: "brouillard",
              48: "brouillard givrant",
              51: "bruine légère",
              53: "bruine",
              55: "bruine forte",
              61: "pluie légère",
              63: "pluie",
              65: "forte pluie",
              71: "neige légère",
              73: "neige",
              75: "fortes chutes de neige",
              80: "averses légères",
              81: "averses",
              82: "fortes averses",
              95: "orage",
              96: "orage avec grêle",
              99: "orage avec forte grêle"
          }

          condition = weather.get(day_code, "conditions variables")
          current_condition = weather.get(current_code, "conditions variables")

          now = datetime.now().strftime("%d/%m/%Y à %H:%M")

          title = f"Météo Cognac : {temp}°C actuellement, max {temp_max}°C"

          description = (
              f"À Cognac, il fait actuellement {temp} degrés, "
              f"avec {current_condition}. "
              f"Aujourd'hui : {condition}, "
              f"minimum {temp_min} degrés et maximum {temp_max} degrés."
          )

          rss = f'''<?xml version="1.0" encoding="UTF-8"?>
          <rss version="2.0">
            <channel>
              <title>Météo Cognac - Charente</title>
              <link>https://open-meteo.com/</link>
              <description>Température et météo actuelle à Cognac</description>
              <language>fr-fr</language>
              <item>
                <title>{title}</title>
                <description>{description}</description>
                <pubDate>{now}</pubDate>
                <guid>meteo-cognac-{now}</guid>
              </item>
            </channel>
          </rss>
          '''

          with open("rss.xml", "w", encoding="utf-8") as f:
              f.write(rss)

          print(description)
          PY

      - name: Publier le flux RSS
        run: |
          git config user.name "Météo Cognac"
          git config user.email "actions@github.com"
          git add rss.xml
          git diff --cached --quiet || git commit -m "Mise à jour météo"
          git push
